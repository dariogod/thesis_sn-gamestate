# TrackLab SoccerNet config for pitch detection and calibration only

# The defaults list contains the files that will be used
# to create the final config file. This item *must* be
# the first element in the file.
defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - state: save
  - visualization: gamestate
  - modules/bbox_detector: yolov8
  - modules/reid: prtreid
  - modules/track: bpbreid_strong_sort
  - modules/pitch: nbjw_calib
  - modules/calibration: nbjw_calib
  - _self_

# Pipeline definition: only pitch detection and calibration
pipeline:
  - bbox_detector
  - reid
  - track
  - pitch
  - calibration

# Experiment name
experiment_name: "sn-pitch-calib"

# Path definitions
home_dir: "${oc.env:HOME}"
data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

# Machine configuration
num_cores: 4
use_wandb: False
use_rich: True

modules:
  bbox_detector: {batch_size: 8}
  reid: {batch_size: 64}
  track: {batch_size: 64}
  pitch: {batch_size: 1}
  calibration: {batch_size: 1}

# Flags
test_tracking: True
eval_tracking: True
print_config: False

# Dataset
dataset:
  nvid: 1
  eval_set: "challenge"
  dataset_path: ${data_dir}/SoccerNetGS/gamestate-2024
  vids_dict:
    valid: []

# Tracker state
state:
  save_file: "states/${experiment_name}.pklz"
  load_file: null

# Visualization
visualization:
  cfg:
    save_videos: True

# configure Hydra
project_dir: "${hydra:runtime.cwd}"
hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "multirun_outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}" 